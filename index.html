<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>听见课堂 · 手机访问测试</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5f0;color:#24473b;font:16px/1.8 system-ui,'Microsoft YaHei',sans-serif}main{max-width:660px;padding:28px 22px;margin:30px auto}.badge{color:#1c7252;background:#d8eddb;padding:8px 16px;border-radius:24px;display:inline-block}h1{font-size:29px;line-height:1.4}section{background:white;padding:22px;border:1px solid #dce7db;border-radius:16px;margin:20px 0}button{padding:13px 20px;background:#246f56;color:white;border:0;border-radius:10px;font-size:16px;cursor:pointer}.track{position:relative;height:65px;margin:20px 0;background:#e9f1e7;border-radius:10px;overflow:hidden;letter-spacing:18px;padding:15px;font-size:21px}.bar{position:absolute;left:0;top:0;bottom:0;width:3px;background:#218e72;animation:move 5s linear infinite}@keyframes move{to{left:100%}}small{color:#6d7e71;display:block}#result{font-weight:bold;min-height:32px}</style><main><span class="badge">✓ 页面已成功打开</span><h1>听见课堂 · 手机访问测试</h1><p>这是免费托管的访问测试页。先确认你的手机、微信和电脑能打开，再接入完整曲库。</p><section><strong>① 动态显示测试</strong><div class="track">1 2 3 5 6 5 3<div class="bar"></div></div><small>如果绿色竖条持续移动，动态显示已工作。</small></section><section><strong>② 点击播放测试音</strong><p>点击后应听到约一秒的柔和提示音。若无声，请检查手机媒体音量。</p><button id="sound">播放测试音</button><p id="result" role="status"></p></section><small>本页不收集账号、位置或设备数据，也不需要登录。它不是曲目准确性测试。</small></main><script>document.getElementById('sound').onclick=async()=>{const out=document.getElementById('result');try{const A=window.AudioContext||window.webkitAudioContext;if(!A)throw Error('浏览器不支持网页音频');const a=new A();await a.resume();const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=440;g.gain.setValueAtTime(0,a.currentTime);g.gain.linearRampToValueAtTime(.12,a.currentTime+.05);g.gain.linearRampToValueAtTime(0,a.currentTime+1);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+1.1);o.onended=()=>a.close();out.textContent='测试音已播放，请确认是否听到声音。'}catch(e){out.textContent='播放未成功：'+e.message}}</script></html>
